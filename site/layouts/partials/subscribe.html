<section class="subscribe-card" aria-labelledby="subscribe-title">
  <div class="subscribe-copy"><div class="subscribe-icon">↗</div><div><h2 id="subscribe-title">{{ i18n "subscribe_title" }}</h2><p>{{ i18n "subscribe_description" }}</p></div></div>
  <div class="url-row"><input id="subscription-url" type="text" readonly value="{{ i18n "connection_required" }}" aria-label="{{ i18n "subscription_url" }}"><button id="copy-url" class="button button-dark" type="button" disabled>{{ i18n "copy_link" }}</button><button id="share-dashboard" class="button button-outline" type="button" disabled>{{ i18n "share_dashboard" }}</button></div>
  <div class="subscription-links" aria-label="{{ i18n "subscription_options" }}"><a href="webcal://calendar.quebit.de/public-calendar/wg.ics">{{ i18n "subscribe_ios" }}</a><a href="https://calendar.google.com/calendar/u/0/r/settings/addbyurl">{{ i18n "subscribe_google" }}</a></div>
  <p class="hint">{{ i18n "subscription_hint" }}</p>
</section>
