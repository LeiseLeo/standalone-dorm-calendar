<dialog id="confirm-dialog" class="dialog dialog-small">
  <form id="confirm-form" method="dialog"><div class="dialog-heading"><div><p class="eyebrow">{{ i18n "delete_entry" }}</p><h2>{{ i18n "confirm_delete" }}</h2></div><button class="icon-button" type="button" data-close="confirm-dialog" aria-label="{{ i18n "cancel" }}">×</button></div><p>{{ i18n "delete_description" }}</p><input type="hidden" id="delete-href"><div class="dialog-actions"><button class="button button-outline" type="button" data-close="confirm-dialog">{{ i18n "cancel" }}</button><button class="button button-danger" type="submit">{{ i18n "delete" }}</button></div></form>
</dialog>
