<dialog id="event-dialog" class="dialog">
  <form id="event-form" method="dialog">
    <div class="dialog-heading"><div><p class="eyebrow" id="event-eyebrow">{{ i18n "new_entry" }}</p><h2 id="event-dialog-title">{{ i18n "add_event" }}</h2></div><button class="icon-button" type="button" data-close="event-dialog" aria-label="{{ i18n "cancel" }}">×</button></div>
    <input type="hidden" id="event-href">
    <input type="hidden" id="event-category">
    <label>{{ i18n "title" }}<input id="event-title" required maxlength="120" placeholder="{{ i18n "event_placeholder" }}"></label>
    <div id="event-detailed-fields" hidden>
      <label>{{ i18n "start_date" }}<input id="event-start-detail" type="date"></label>
      <label>{{ i18n "end_date" }}<input id="event-end" type="date" required></label>
      <label id="event-all-day-row" class="check-row"><input id="event-all-day" type="checkbox" checked><span>{{ i18n "all_day" }}</span></label>
      <div id="event-time-row" class="form-grid">
        <label>{{ i18n "start_time" }}<input id="event-start-time" type="time"></label>
        <label>{{ i18n "end_time" }}<input id="event-end-time" type="time"></label>
      </div>
      <label class="check-row"><input id="event-repeating" type="checkbox"><span>{{ i18n "repeat_event" }}</span></label>
      <label id="event-frequency-row" hidden>{{ i18n "repeat_frequency" }}<select id="event-frequency"><option value="DAILY">{{ i18n "frequency_daily" }}</option><option value="WEEKLY" selected>{{ i18n "frequency_weekly" }}</option><option value="MONTHLY">{{ i18n "frequency_monthly" }}</option><option value="YEARLY">{{ i18n "frequency_yearly" }}</option></select></label>
    </div>
    <label id="birthday-date-row">{{ i18n "date" }}<input id="event-start" type="date"></label>
    <label id="birthday-repeat-row" class="check-row"><input id="event-yearly" type="checkbox"><span>{{ i18n "repeat_yearly" }}</span></label>
    <label>{{ i18n "event_description" }} <span class="optional">{{ i18n "optional" }}</span><textarea id="event-description" rows="3" maxlength="2000" placeholder="{{ i18n "description_placeholder" }}"></textarea></label>
    <div class="dialog-actions"><button class="button button-outline" type="button" data-close="event-dialog">{{ i18n "cancel" }}</button><button class="button button-dark" type="submit">{{ i18n "save" }}</button></div>
  </form>
</dialog>
