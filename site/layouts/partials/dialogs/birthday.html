<dialog id="birthday-dialog" class="dialog">
  <form id="birthday-form" method="dialog">
    <div class="dialog-heading"><div><p class="eyebrow" id="birthday-eyebrow">{{ i18n "new_entry" }}</p><h2 id="birthday-dialog-title">{{ i18n "add_birthday" }}</h2></div><button class="icon-button" type="button" data-close="birthday-dialog" aria-label="{{ i18n "cancel" }}">×</button></div>
    <input type="hidden" id="birthday-href">
    <input type="hidden" id="birthday-category">
    <label>{{ i18n "title" }}<input id="birthday-title" required maxlength="120" placeholder="{{ i18n "birthday_placeholder" }}"></label>
    <label>{{ i18n "date" }}<input id="birthday-date" type="date" required></label>
    <label class="check-row"><input id="birthday-yearly" type="checkbox"><span>{{ i18n "repeat_yearly" }}</span></label>
    <label>{{ i18n "event_description" }} <span class="optional">{{ i18n "optional" }}</span><textarea id="birthday-description" rows="3" maxlength="2000" placeholder="{{ i18n "description_placeholder" }}"></textarea></label>
    <div class="dialog-actions"><button class="button button-outline" type="button" data-close="birthday-dialog">{{ i18n "cancel" }}</button><button class="button button-dark" type="submit">{{ i18n "save" }}</button></div>
  </form>
</dialog>
