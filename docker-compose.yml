services:
  baikal:
    build:
      context: ./baikal
      dockerfile: Dockerfile
    image: wg-calendar-baikal:local
    container_name: wg-calendar-baikal
    restart: unless-stopped
    expose:
      - "80"
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BAIKAL_ADMIN_PASSWORD: ${BAIKAL_ADMIN_PASSWORD:?Set BAIKAL_ADMIN_PASSWORD in .env}
      BAIKAL_WG_USERNAME: ${BAIKAL_WG_USERNAME:?Set BAIKAL_WG_USERNAME in .env}
      BAIKAL_WG_PASSWORD: ${BAIKAL_WG_PASSWORD:?Set BAIKAL_WG_PASSWORD in .env}
      BAIKAL_WG_EMAIL: ${BAIKAL_WG_EMAIL:?Set BAIKAL_WG_EMAIL in .env}
      BAIKAL_CONFIGURED_VERSION: ${BAIKAL_CONFIGURED_VERSION:-0.10.1}
    volumes:
      - baikal-config:/var/www/baikal/config
      - baikal-data:/var/www/baikal/Specific

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SITE_TITLE: ${SITE_TITLE:-WG-Kalender}
        SITE_URL: ${SITE_URL:-http://localhost:8080/}
    container_name: wg-calendar-web
    restart: unless-stopped
    depends_on:
      - baikal
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  baikal-config:
  baikal-data:
